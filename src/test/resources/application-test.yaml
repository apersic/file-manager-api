DATASOURCE_URL: jdbc:postgresql://localhost:5432/file_manager
DATASOURCE_USERNAME: file_manager_user
DATASOURCE_PASSWORD: file_manager_password
SHOW_SQL: false
SERVER_PORT: 0

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origin-patterns: http://localhost:5173,http://127.0.0.1:5173

logging:
  level:
    filemanager: INFO
